name: release

# Tagged releases publish two things a consumer can pin:
#   - cross-compiled binaries, with a checksum file, attached to the release
#   - the worker image on ghcr.io, and its digest in the release notes
#
# The image is built here rather than on a developer machine because probe does
# not require a container runtime to build, and the Vora test host has none
# either. Pinning is the point: consumers reference the image by digest.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: format
        run: |
          out=$(gofmt -l . | grep -v '^$' || true)
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - run: go vet ./...
      # No credentials and no network calls: the offline suite must pass before
      # anything is published.
      - run: go test ./...

  binaries:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build
        run: make release VERSION="${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*.tar.gz

  image:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.worker
          push: true
          tags: |
            ghcr.io/vorash/vora-probe-worker:${{ github.ref_name }}
            ghcr.io/vorash/vora-probe-worker:latest
      - name: record digest
        run: echo "${{ steps.build.outputs.digest }}" > image-digest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: image-digest
          path: image-digest.txt

  release:
    needs: [binaries, image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: notes
        run: |
          digest=$(cat artifacts/image-digest/image-digest.txt)
          {
            echo "Binaries for linux/amd64 and linux/arm64 are attached, with \`checksums.txt\`."
            echo
            echo "Worker image, to be referenced **by digest** rather than tag:"
            echo
            echo '```'
            echo "ghcr.io/vorash/vora-probe-worker@${digest}"
            echo '```'
            echo
            echo "The worker runs that image inside a Vora sandbox with \`--network none\`."
          } > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/dist/*.tar.gz
            artifacts/dist/checksums.txt
          body_path: notes.md
