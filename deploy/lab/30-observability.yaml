# The lab's telemetry: Prometheus scrapes, kube-state-metrics for object state.
#
# No Prometheus Operator, no ServiceMonitor, no Grafana. The cap on this
# namespace is 2 GiB and a human dashboard is the first thing that can go.
# Container memory comes from the kubelet's cadvisor endpoint because the k3s
# node runs with `--disable metrics-server`.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: probe-lab
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    scrape_configs:
      # Container memory. Scraped through the API server proxy so the kubelet's
      # self-signed certificate is not the controller's problem.
      #
      # The node name is deliberately literal: this is a single-node lab, and a
      # discovery rule that silently scrapes more nodes would be a wider read
      # than the investigator's scope allows.
      - job_name: kubernetes-cadvisor
        scheme: https
        metrics_path: /api/v1/nodes/vora-mini/proxy/metrics/cadvisor
        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        static_configs:
          - targets: ["kubernetes.default.svc:443"]
      - job_name: kube-state-metrics
        static_configs:
          - targets: ["kube-state-metrics.probe-lab.svc:8080"]
      - job_name: memory-test
        static_configs:
          - targets: ["memory-test.probe-lab.svc:8080"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: probe-lab
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=6h
            - --storage.tsdb.retention.size=512MB
          ports:
            - name: http
              containerPort: 9090
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        # Ephemeral on purpose: six hours of a disposable lab is all the slice
        # needs, and a PVC would outlive the point of the exercise.
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: probe-lab
  labels:
    app: prometheus
spec:
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: probe-lab
  labels:
    app: kube-state-metrics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kube-state-metrics
  template:
    metadata:
      labels:
        app: kube-state-metrics
    spec:
      serviceAccountName: kube-state-metrics
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.13.0
          args:
            - --namespaces=probe-lab
            - --resources=pods,deployments,replicasets
            - --port=8080
            - --telemetry-port=8081
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
  namespace: probe-lab
  labels:
    app: kube-state-metrics
spec:
  selector:
    app: kube-state-metrics
  ports:
    - name: http
      port: 8080
      targetPort: http
